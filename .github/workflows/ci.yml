name: c-codegen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  c-runner:
    name: 编译 C 运行器并比对参考序列
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mission: quad
            ref: quad_step_ref.csv
            out: quad.csv
          - mission: fw
            ref: fw_mission_ref.csv
            out: fw.csv
          - mission: tilt
            ref: tilt_mission_ref.csv
            out: tilt.csv
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        working-directory: c
        run: make

      - name: 运行 ${{ matrix.mission }} 任务
        working-directory: c
        run: |
          mkdir -p out
          ./build/uav_${{ matrix.mission }}_runner out/${{ matrix.out }}

      - name: 比对参考序列
        run: python3 c/compare_csv.py c/ref/${{ matrix.ref }} c/out/${{ matrix.out }}

      - name: 上传轨迹
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mission }}-csv
          path: c/out/${{ matrix.out }}
