name: c-codegen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  c-runner:
    name: 编译 C 运行器并比对参考序列
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        working-directory: c
        run: make

      - name: 运行阶跃任务
        working-directory: c
        run: |
          mkdir -p out
          ./build/uav_quad_runner

      - name: 比对参考序列
        run: python3 c/compare_csv.py c/ref/quad_step_ref.csv c/out/quad_step.csv

      - name: 上传轨迹
        uses: actions/upload-artifact@v4
        with:
          name: quad-step-csv
          path: c/out/quad_step.csv
